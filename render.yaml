# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: curve-royale
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

# Curve Royale on a VPS: the game server plus Caddy for HTTPS.
# Host networking so WebRTC can use the server's real IP and UDP port directly.
services:
  game:
    build: ..
    network_mode: host
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1              # only Caddy talks to it
      PORT: 3000
      RTC_PORT: ${RTC_PORT:-40000} # UDP port for WebRTC (open it in the firewall)
      RTC_PUBLIC_IP: ${RTC_PUBLIC_IP:-}
    volumes:
      - game_data:/data            # player profiles and leaderboards (survives redeploys)
    logging:
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy-sites:/etc/caddy/sites:ro   # extra sites kept on the server (see Caddyfile)
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  game_data:
  caddy_data:
  caddy_config:
